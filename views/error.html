<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied - CarbonLens</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-card text-center" style="max-width: 480px;">
    <div class="stat-icon-wrapper stat-icon-alert mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h3 class="fw-bold text-danger mb-2">Access Denied</h3>
    <p class="text-muted mb-4">
      You do not have permission to view this resource. Role-based access control (RBAC) is enforced server-side.
    </p>

    <div class="d-flex justify-content-center gap-2">
      <a href="/" class="btn btn-leaf">
        <i class="bi bi-house-door-fill me-1"></i> Return to Dashboard
      </a>
      <button onclick="handleLogout()" class="btn btn-outline-secondary">
        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
      </button>
    </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
