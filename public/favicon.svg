<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer ring / lens circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#ring)" stroke-width="2.5"/>

  <!-- Subtle inner glow ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#A5D6A7" stroke-width="0.8" opacity="0.5"/>

  <!-- Stem -->
  <path d="M32 46 Q31 38 32 28" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>

  <!-- Left leaf -->
  <path d="M32 34 Q18 28 18 16 Q30 18 32 34Z" fill="url(#leaf1)" stroke="#2E7D32" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Right leaf -->
  <path d="M32 28 Q46 22 46 10 Q34 12 32 28Z" fill="url(#leaf2)" stroke="#388E3C" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Leaf vein left -->
  <path d="M32 34 Q24 26 19 17" stroke="#1B5E20" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Leaf vein right -->
  <path d="M32 28 Q39 20 45 11" stroke="#2E7D32" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

  <!-- CO2 molecule dots – tiny accent -->
  <circle cx="14" cy="44" r="2.2" fill="#81C784" opacity="0.7"/>
  <circle cx="20" cy="50" r="1.5" fill="#A5D6A7" opacity="0.6"/>
  <circle cx="50" cy="42" r="1.8" fill="#66BB6A" opacity="0.6"/>

  <!-- Lens flare highlight -->
  <ellipse cx="22" cy="18" rx="5" ry="3" fill="white" opacity="0.18" transform="rotate(-30 22 18)"/>

  <!-- Gradient definitions -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#E8F5E9"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="leaf1" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#43A047"/>
      <stop offset="100%" stop-color="#A5D6A7"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
  </defs>
</svg>
